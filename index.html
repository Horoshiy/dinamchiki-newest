<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      Иконки собраны из настоящего логотипа клуба (файлы переданы 04.09.2026).
      Раньше здесь был нарисованный щит с монограммой — своего знака у проекта
      не было. Нарисованный favicon.svg удалён, поэтому mask-icon больше нет:
      Safari в этом случае берёт обычную иконку.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e50d8" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=yes" />
    <meta name="geo.region" content="RU-STA" />
    <meta name="geo.placename" content="Ставрополь" />

    <!-- Primary meta -->
    <title>ДФК «Динамчики» — детский футбольный клуб в Ставрополе</title>
    <meta
      name="description"
      content="Детский футбольный клуб «Динамчики» в Ставрополе: группы для детей 3–14 лет в разных районах города, занятия по образовательной лицензии. Первая тренировка — бесплатно."
    />
    <meta name="keywords" content="детский футбол, футбол Ставрополь, тренировки для детей, футбольная секция, Динамчики, ФК Динамо Ставрополь" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ДФК «Динамчики»" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="ДФК «Динамчики» — детский футбольный клуб в Ставрополе" />
    <meta property="og:description" content="Профессиональные тренировки, опытные тренеры и регулярные турниры — всё, чтобы ваш ребёнок полюбил футбол и научился играть в команде." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og/dinamchiki-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ДФК «Динамчики» — детский футбольный клуб" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ДФК «Динамчики» — детский футбол в Ставрополе" />
    <meta name="twitter:description" content="Группы для детей 3–14 лет в разных районах Ставрополя. Первая тренировка — бесплатно." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og/dinamchiki-cover.png" />

    <!-- Canonical -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Шрифты (Manrope, Inter) лежат у нас: src/main.ts → @fontsource-variable.
         С Google Fonts IP посетителей уходили за рубеж (152-ФЗ), а стили
         блокировали отрисовку. -->

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsClub",
        "name": "ДФК «Динамчики»",
        "alternateName": "Dinamchiki",
        "url": "%VITE_SITE_URL%/",
        "logo": "%VITE_SITE_URL%/favicon/logo-512.png",
        "description": "Детский футбольный клуб в Ставрополе для детей 3–14 лет",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ставрополь",
          "addressRegion": "Ставропольский край",
          "addressCountry": "RU",
          "streetAddress": "Стадион «Динамо»"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "%VITE_CLUB_PHONE%",
          "contactType": "customer service",
          "areaServed": "RU",
          "availableLanguage": ["Russian"]
        },
        "sport": "Football",
        "audience": {
          "@type": "PeopleAudience",
          "suggestedMinAge": 4,
          "suggestedMaxAge": 14
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
