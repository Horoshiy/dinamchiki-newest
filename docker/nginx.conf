# =============================================================================
# Nginx config для SPA (vue-router history mode).
# Все пути, которые не указывают на реальный файл → /index.html,
# чтобы history-API работала при прямом заходе на /teams, /coaches и т.д.
# =============================================================================

server {
    listen       80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- Заголовки безопасности --------------------------------------------
    # ВНИМАНИЕ: connect-src перечисляет бета-API (apigql.dinamchiki.ru).
    # При переходе на прод заменить на боевой домен API — иначе браузер
    # заблокирует запросы, и сайт молча останется без данных.
    # Статический SPA без внешних скриптов, поэтому CSP можно держать жёсткой.
    # 'unsafe-inline' в style-src нужен для scoped-стилей Vue и inline-SVG.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://apigql.dinamchiki.ru wss://apigql.dinamchiki.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # Сервер не обязан рассказывать свою версию.
    server_tokens off;

    # gzip для текстовых ассетов
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # Hashed-ассеты Vite (immutable, можно кэшировать на год)
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Статика из public/ — кэшируем, но с возможностью revalidate
    location ~* \.(?:png|jpg|jpeg|svg|gif|webp|ico|woff2?|ttf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # health-check
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Не отдаём .env / dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
