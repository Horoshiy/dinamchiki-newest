# =============================================================================
# Боевой vhost dinamchiki.ru для нового сайта (пререндеренная сборка).
#
# Заменяет /etc/nginx/sites-enabled/dinamchiki.ru.conf на проде В МОМЕНТ
# ПЕРЕЕЗДА. До этого не применять: сейчас там старый React-сайт.
#
# Сборка: npm run build:static с боевым .env.production
#   (VITE_SITE_URL=https://dinamchiki.ru, VITE_ALLOW_INDEXING=true, VITE_YM_ID=31195281,
#    VITE_GRAPHQL_HTTP — боевой API: бета-хост сборка не пропустит).
#
# Раздача:
#   - готовые страницы: /path → /path/index.html (пререндер);
#   - детальные страницы вне пререндера (игроки, турниры, новые группы) → spa.html;
#   - всё прочее → честный 404 со страницей 404.html;
#   - старые адреса прежнего сайта → 301 на новые.
#
# Блоки /vkid/ и /uploads/ перенесены из действующего конфига без изменений.
# =============================================================================

map $uri $dinamchiki_cache_control {
    ~^/assets/                                          "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|svg|gif|webp|ico|woff2?|ttf|eot)$  "public, max-age=2592000";
    default                                             "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name dinamchiki.ru www.dinamchiki.ru;
    return 301 https://dinamchiki.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dinamchiki.ru;
    return 301 https://dinamchiki.ru$request_uri;

    ssl_certificate /etc/letsencrypt/live/dinamchiki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dinamchiki.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dinamchiki.ru/chain.pem;
    include snippets/ssl-params.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dinamchiki.ru;

    root /var/www/dinamchiki.ru/html;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/dinamchiki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dinamchiki.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dinamchiki.ru/chain.pem;
    include snippets/ssl-params.conf;

    # Заголовки только здесь, на уровне server: add_header внутри location
    # отменяет все заголовки уровня выше. Кэш задаёт map, а не location.
    # connect-src: заменить apigql.dinamchiki.ru на боевой API.
    add_header Cache-Control $dinamchiki_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://mc.yandex.ru; connect-src 'self' https://apigql.dinamchiki.ru wss://apigql.dinamchiki.ru https://mc.yandex.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # --- Из действующего конфига ---------------------------------------------
    # VK ID OAuth (контейнер dynamost-vkid-oauth из dynamost-backend)
    location ^~ /vkid/ {
        proxy_pass http://127.0.0.1:8202;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /uploads/ {
        alias /var/www/dinamchiki.ru/uploads/;
        expires 7d;
    }

    # --- Старые адреса ---------------------------------------------------------
    # «Сведения»: прежний сайт использовал нестандартные адреса подразделов.
    location = /sveden/leadership { return 301 /sveden/managers; }
    location = /sveden/paid-edu   { return 301 /sveden/paid_edu; }
    location = /sveden/meals      { return 301 /sveden/catering; }

    # Турниры прежнего сайта жили под /tournaments/<id> из API бота —
    # у нового сайта другие id, поэтому ведём на общий список.
    location ~ ^/tournaments/.+ { return 301 /tournaments; }

    # Реферальной страницы на новом сайте нет.
    location = /friends { return 301 /; }

    # РЕШИТЬ ДО ПЕРЕЕЗДА: «Футбольное наследие» (/nasledie/<slug>) есть
    # только на прежнем сайте. Без решения ссылки родителей станут 404.

    # Хвостовой слэш — дубль страницы.
    location ~ ^(.+)/$ { return 301 $1; }

    # --- Новый сайт --------------------------------------------------------------
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(team|coach|player|tournament)/[^/]+$ {
        try_files $uri/index.html /spa.html;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\. {
        deny all;
    }
}
