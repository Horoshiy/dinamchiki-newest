# =============================================================================
# Боевой vhost dinamchiki.ru для нового сайта (пререндеренная сборка).
#
# Действует на проде с 31.10.2026: /etc/nginx/sites-available/dinamchiki.ru.conf.
# Правка здесь сама на прод не попадает — после изменения скопировать файл
# на сервер, nginx -t, reload.
#
# Раскладка на сервере (/var/www/dinamchiki.ru):
#   current  → releases/<sha>   новая сборка; CI выкладывает релиз и переключает ссылку
#   legacy/                     прежний сайт (React) — только для /nasledie/ и
#                               старых файлов, которых нет в новой сборке
#   uploads/                    логотипы команд (раздаётся как раньше)
#
# Сборка: npm run build:static с .env.production (API — graphql.dinamchiki.ru).
#
# Раздача:
#   - готовые страницы: /path → /path/index.html (пререндер);
#   - детальные страницы вне пререндера (игроки, турниры, новые группы) → spa.html;
#   - всё прочее → честный 404 со страницей 404.html;
#   - старые адреса прежнего сайта → 301 на новые.
#
# Блоки /vkid/ и /uploads/ перенесены из действующего конфига без изменений.
# =============================================================================

map $uri $dinamchiki_cache_control {
    ~^/assets/                                          "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|svg|gif|webp|ico|woff2?|ttf|eot)$  "public, max-age=2592000";
    default                                             "no-cache";
}

# Страницы детей (/player/*) не индексируются. Мета-тег robots ставит JS,
# но spa.html отдаётся без него — поисковик без JS видел бы «index».
# Пустое значение — заголовок не добавляется.
map $uri $dinamchiki_robots {
    ~^/player/  "noindex, nofollow";
    default     "";
}

server {
    listen 80;
    listen [::]:80;
    server_name dinamchiki.ru www.dinamchiki.ru;
    return 301 https://dinamchiki.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dinamchiki.ru;
    return 301 https://dinamchiki.ru$request_uri;

    ssl_certificate /etc/letsencrypt/live/dinamchiki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dinamchiki.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dinamchiki.ru/chain.pem;
    include snippets/ssl-params.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dinamchiki.ru;

    root /var/www/dinamchiki.ru/current;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/dinamchiki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dinamchiki.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dinamchiki.ru/chain.pem;
    include snippets/ssl-params.conf;

    # Заголовки только здесь, на уровне server: add_header внутри location
    # отменяет все заголовки уровня выше. Кэш задаёт map, а не location.
    # frame-src yandex — карта площадок, mc.yandex — Метрика.
    add_header Cache-Control $dinamchiki_cache_control always;
    add_header X-Robots-Tag $dinamchiki_robots always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://mc.yandex.ru; frame-src https://yandex.ru https://*.yandex.ru; connect-src 'self' https://graphql.dinamchiki.ru https://mc.yandex.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # --- Из действующего конфига ---------------------------------------------
    # VK ID OAuth (контейнер dynamost-vkid-oauth из dynamost-backend)
    location ^~ /vkid/ {
        proxy_pass http://127.0.0.1:8202;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /uploads/ {
        alias /var/www/dinamchiki.ru/uploads/;
        expires 7d;
    }

    # --- Старые адреса ---------------------------------------------------------
    # «Сведения»: прежний сайт использовал нестандартные адреса подразделов.
    location = /sveden/leadership { return 301 /sveden/managers; }
    location = /sveden/paid-edu   { return 301 /sveden/paid_edu; }
    location = /sveden/meals      { return 301 /sveden/catering; }

    # Турниры прежнего сайта жили под /tournaments/<id> из API бота —
    # у нового сайта другие id, поэтому ведём на общий список.
    location ~ ^/tournaments/.+ { return 301 /tournaments; }

    # Реферальной страницы на новом сайте нет.
    location = /friends { return 301 /; }

    # Политика и согласие на обработку ПДн.
    location = /politika-obrabotki-pd     { return 301 /privacy; }
    location = /soglasie-na-obrabotku-pd  { return 301 /consent; }

    # Правила распорядка в новой редакции лежат под новым именем.
    location = /documents/pravila_vnutrennego_rasporyadka_dinamchiki_cyr.pdf {
        return 301 /documents/pravila_rasporyadka.pdf;
    }

    # «Футбольное наследие» (/nasledie/<slug>, ссылки из бота) есть только у
    # прежнего сайта: отдаём его сборку из legacy/. Данные она берёт из
    # api.dinamchiki.ru (go-graphql) — CSP нового сайта ей не подходит, поэтому
    # заголовки задаются здесь заново (add_header в location отменяет серверные).
    location ^~ /nasledie/ {
        root /var/www/dinamchiki.ru/legacy;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Файлы, которых нет в новой сборке (скрипты прежнего сайта для /nasledie/,
    # старые PDF вроде program-*.pdf), ищутся в legacy/.
    location ^~ /assets/ {
        try_files $uri @legacy;
    }
    location ^~ /documents/ {
        try_files $uri @legacy;
    }
    location @legacy {
        root /var/www/dinamchiki.ru/legacy;
        try_files $uri =404;
    }

    # Хвостовой слэш — дубль страницы.
    location ~ ^(.+)/$ { return 301 $1; }

    # --- Новый сайт --------------------------------------------------------------
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(team|coach|player|tournament)/[^/]+$ {
        try_files $uri/index.html /spa.html;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # /.well-known/ нужен certbot (webroot) — не закрываем его вместе с .git и т.п.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
